name: Build Official Sub2API Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Official Sub2API tag, for example v0.1.152
        required: false
        type: string
        default: v0.1.155
      simple_release:
        description: Kept for compatibility with Sub2API web update inputs
        required: false
        type: boolean
        default: true
      image:
        description: Target image without tag
        required: false
        type: string
        default: ghcr.io/qbz8808-sudo/sub2api-ccsfix-build

permissions:
  contents: read
  packages: write

concurrency:
  group: sub2api-official-safeupdate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout official source
        uses: actions/checkout@v4
        with:
          repository: Wei-Shaw/sub2api
          ref: ${{ inputs.tag || 'v0.1.155' }}
          fetch-depth: 1
          fetch-tags: true

      - name: Resolve build version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${REQUESTED_TAG:-v0.1.155}"
          IMAGE="${REQUESTED_IMAGE:-ghcr.io/${GITHUB_REPOSITORY}}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid official tag: ${TAG}"
            exit 1
          fi
          if [ -z "${IMAGE}" ]; then
            IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          fi
          IMAGE="$(printf '%s' "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Record official source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          COMMIT="$(git rev-parse HEAD)"
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "${COMMIT}" != "${TAG_COMMIT}" ]; then
            echo "checkout does not match official tag ${TAG}: ${COMMIT} != ${TAG_COMMIT}"
            exit 1
          fi
          CANDIDATE_TAG="official-${TAG}-${COMMIT:0:12}"
          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "candidate_tag=${CANDIDATE_TAG}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Official Sub2API source'
            echo '- repository: `Wei-Shaw/sub2api`'
            echo "- tag: \`${TAG}\`"
            printf '%s\n' "- commit: \`${COMMIT}\`"
            printf '%s\n' "- candidate image tag: \`${CANDIDATE_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        working-directory: backend
        shell: bash
        run: |
          required="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          go version | grep -q "go${required}"

      - name: Backend tests
        working-directory: backend
        run: go test -tags=unit ./internal/service ./internal/handler/admin ./internal/server

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: pnpm exec vitest run src/views/admin/__tests__/SettingsView.spec.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.source.outputs.commit }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.source.outputs.candidate_tag }}

      - name: Record candidate image
        shell: bash
        env:
          IMAGE: ${{ steps.version.outputs.image }}:${{ steps.source.outputs.candidate_tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo '### Candidate image'
            printf '%s\n' "- image: \`${IMAGE}\`"
            printf '%s\n' "- digest: \`${DIGEST}\`"
            echo '- automatic deployment: disabled'
          } >> "${GITHUB_STEP_SUMMARY}"
