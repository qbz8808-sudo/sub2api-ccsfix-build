name: Build 429 Patch Image

on:
  push:
    branches:
      - codex/official-main-openai-oauth-429-retry
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-429-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/qbz8808-sudo/sub2api-ccsfix-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=official-429
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=0.1.158-429
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=sub2api-429
          cache-to: type=gha,mode=max,scope=sub2api-429
          provenance: false
